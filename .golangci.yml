version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - misspell
    - revive
  settings:
    errcheck:
      # Intentional `_, _ = f()` and `_ = f()` discards are widely used in the
      # codebase as an explicit "I know this returns an error, drop it" marker.
      # check-blank/check-type-assertions=true would treat them as failures.
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (net.PacketConn).WriteTo
        - (net.Conn).Write
        - encoding/json.MarshalIndent
        - (*github.com/pion/dtls/v3.Conn).SetDeadline
    govet:
      # shadow tripped on legitimate inner `err :=` patterns from error wrapping
      # and on `ok` reuse across separate scopes; turning enable-all with shadow
      # forces deep renames without catching real bugs.
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    revive:
      rules:
        - name: blank-imports
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        # var-naming dropped: proto messages carry `Tcp` (not `TCP`) in their
        # generated Go types, and our hand-written helpers thread that name to
        # match. Flipping every wrapper to `TCP` makes them mismatch the proto.
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        source: "doRequest|packetPool\\.Get"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
