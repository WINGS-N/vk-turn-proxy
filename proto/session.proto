syntax = "proto3";

package sessionproto;

option go_package = "github.com/cacggghp/vk-turn-proxy/sessionproto;sessionproto";

enum ClientHelloType {
  CLIENT_HELLO_TYPE_UNSPECIFIED = 0;
  CLIENT_HELLO_TYPE_PROBE = 1;
  CLIENT_HELLO_TYPE_SESSION = 2;
  CLIENT_HELLO_TYPE_ROOM_EXCHANGE = 3;
  CLIENT_HELLO_TYPE_PROVISION = 4;
}

enum TransportMode {
  TRANSPORT_MODE_UNSPECIFIED = 0;
  TRANSPORT_MODE_DATAGRAM = 1;
  TRANSPORT_MODE_TCP = 2;
}

enum TcpTransportFlavor {
  TCP_TRANSPORT_FLAVOR_UNSPECIFIED = 0;
  TCP_TRANSPORT_FLAVOR_LEGACY_KCP_SMUX = 1;
  TCP_TRANSPORT_FLAVOR_DIRECT_SMUX = 2;
}

enum WrapCipher {
  WRAP_CIPHER_UNSPECIFIED = 0;
  WRAP_CIPHER_NONE = 1;
  // SRTP-mimicry AEAD. The wire packet is [12B RTP header | 12B nonce |
  // AEAD ciphertext | 16B tag]; the RTP header makes the datagram look
  // like opus voice traffic so VK TURN's content filter forwards it on
  // the fast path.
  WRAP_CIPHER_SRTP_AES_256_GCM = 2;
  WRAP_CIPHER_SRTP_CHACHA20_POLY1305 = 3;
}

message ClientHello {
  uint32 version = 1;
  ClientHelloType type = 2;
  bytes session_id = 3;
  uint32 stream_id = 4;
  TransportMode requested_transport = 5;
  repeated TransportMode supported_transports = 6;
  repeated TcpTransportFlavor supported_tcp_flavors = 7;
  TcpTransportFlavor preferred_tcp_flavor = 8;
  RoomDataExchange room_exchange = 9;
  // WRAP per-packet obfuscation negotiation. Order in supported_wrap_ciphers
  // expresses client preference (most-preferred first).
  repeated WrapCipher supported_wrap_ciphers = 10;
  // Optional client-proposed shared key (32 bytes for AES-256-CTR/ChaCha20).
  // Server may accept or fall back to its preset key based on configuration.
  bytes wrap_key_proposal = 11;
  // Set on CLIENT_HELLO_TYPE_PROVISION: the app asks the node to mint (or return)
  // its WireGuard config. The node forwards client_id + token to the panel over
  // gRPC for verification; it never mints a config on its own.
  ProvisionRequest provision = 12;
  // Managed clients announce their panel client id on every SESSION hello (it is
  // not a secret, unlike the provision token) so the node can attribute the
  // session to a client and report that client's traffic-limit usage back in the
  // heartbeat.
  string client_id = 13;
}

message ProvisionRequest {
  string client_id = 1;
  bytes token = 2;
  string hwid = 3;
  uint32 local_port = 4;
}

message ProvisionResponse {
  WireguardConfig wg = 1;
  string error = 2;
}

message WireguardConfig {
  string private_key = 1;
  string public_key = 2;
  string address = 3;
  string server_public_key = 4;
  string allowed_ips = 5;
  uint32 mtu = 6;
}

enum RoomProvider {
  ROOM_PROVIDER_UNSPECIFIED = 0;
  ROOM_PROVIDER_WB_STREAM = 1;
}

message RoomDataExchange {
  RoomProvider provider = 1;
  string room_id = 2;
  string display_name = 3;
  bool e2e_enabled = 4;
  bytes e2e_secret = 5;
  repeated string room_ids = 6;
}

message RoomDataAck {
  bool accepted = 1;
  string error = 2;
}

message ServerHello {
  uint32 version = 1;
  bool mu_supported = 2;
  string error = 3;
  bool control_heartbeat_supported = 4;
  TransportMode selected_transport = 5;
  repeated TransportMode supported_transports = 6;
  repeated TcpTransportFlavor supported_tcp_flavors = 7;
  TcpTransportFlavor selected_tcp_flavor = 8;
  // Final WRAP cipher chosen by the server.
  //   WRAP_CIPHER_UNSPECIFIED / WRAP_CIPHER_NONE → stay on raw datagrams.
  WrapCipher selected_wrap_cipher = 9;
}

message Heartbeat {
  uint32 version = 1;
  int64 wall_clock_ms = 2;
  uint32 active_streams = 3;
  bool online = 4;
  string proto_fingerprint = 5;
  string session_mode = 6;
  string control_path = 7;
  string provider = 8;
  TransportMode transport = 9;
  // Managed-client traffic-limit state the node fetched from the panel and echoes
  // to the app so it can show used/remaining. traffic_present distinguishes "the
  // node has usage for this client" from an absent/zero reading; limit 0 = no cap.
  bool traffic_present = 10;
  uint64 traffic_limit_bytes = 11;
  uint64 traffic_used_bytes = 12;
  uint64 traffic_remaining_bytes = 13;
  bool traffic_disabled = 14;
}
